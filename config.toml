baseURL = "https://superxddd.github.io/"
languageCode = "zh-cn"
title = "许达的技术博客"
theme = "PaperMod"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableGitInfo = true

# 没有 front matter 的 Markdown 也可以直接发布。
# 优先使用文章中指定的日期；否则使用 Git 提交日期或文件修改时间。
[frontmatter]
date = ["date", "publishDate", ":git", ":fileModTime"]

[pagination]
pagerSize = 10

[params]
mainSections = ["posts"]
rssFullContent = true
description = "专注数据库内核、系统软件与后端基础设施"
author = "许达"
env = "production"
defaultTheme = "auto"
ShowReadingTime = true
ShowWordCount = true
ShowCodeCopyButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowToc = true
TocOpen = true
comments = false

[params.footer]
since = 2026

[[params.socialIcons]]
name = "GitHub"
url = "https://github.com/superxddd"

[[params.socialIcons]]
name = "RSS"
url = "/index.xml"

[menu]
[[menu.main]]
identifier = "home"
name = "首页"
url = "/"
weight = 1

[[menu.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 2

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 3

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 4

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 5

[[menu.main]]
identifier = "about"
name = "关于"
url = "/about/"
weight = 6

[outputs]
home = ["HTML", "RSS", "JSON"]
